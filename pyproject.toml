[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard"
version = "0.1.0"
description = "End-to-end telecom churn prediction: calibrated model, cost-optimal targeting, SHAP reasons, API and dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "scikit-learn>=1.5,<1.9",
    "imbalanced-learn>=0.12,<0.15",
    "xgboost>=2.1,<4",
    "lightgbm>=4.5,<5",
    "optuna>=3.6,<5",
    "shap>=0.46,<1",
    "mlflow>=2.16,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8,<3",
    "streamlit>=1.38,<2",
    "pyyaml>=6,<7",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "black>=24.8,<27",
    "pre-commit>=3.8,<5",
    "httpx>=0.27,<1",
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbconvert>=7.16,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/churnguard --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
