name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install (dev and training extras, runtime pinned by the lock)
        # The lock keeps XGBoost, scikit-learn etc. at the versions the committed model was built
        # with. It names the Docker-only `xgboost-cpu` build; mapping it back to `xgboost` makes the
        # pin apply here too (otherwise pip would add a second, unpinned XGBoost).
        run: pip install -e ".[dev,train]" -c <(sed 's/^xgboost-cpu==/xgboost==/' requirements.lock)

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Download and prepare data
        run: |
          python scripts/download_data.py
          python -m churnguard.data.prepare

      - name: Tests with coverage (fails under 80%)
        run: pytest --cov-fail-under=80
